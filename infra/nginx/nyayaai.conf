server {
  listen 80;
  server_name _;
  client_max_body_size 50m;
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /health {
    proxy_pass http://api:8000/health;
  }
}
