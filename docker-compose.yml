services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis, chroma]
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    command: ["python", "-m", "backend.app.workers.jobs"]
    depends_on: [postgres, redis, chroma]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nyaya
      POSTGRES_USER: nyaya
      POSTGRES_PASSWORD: nyaya
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  chroma:
    image: chromadb/chroma:0.6.3
    ports: ["8001:8000"]
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports: ["8081:8081"]
    depends_on: [api]
volumes:
  postgres_data:
